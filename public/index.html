<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LouiseTicker</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body class="signed-out">
  <!-- shown until someone logs in -->
  <div class="login-screen" id="loginScreen">
    <form class="login-box" id="loginForm" autocomplete="on">
      <div class="brand big"><img src="icon.svg" alt="" width="38" height="38"><span>Louise<b>Ticker</b></span></div>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required autofocus></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <div class="err-msg" id="loginErr"></div>
      <button class="btn primary">Log in</button>
    </form>
  </div>

  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="26" height="26">
      <span>Louise<b>Ticker</b></span>
      <span class="live-dot" id="liveDot" title="Live connection to server"></span>
    </div>
    <div class="top-actions">
      <button class="btn primary" id="btnAddFeed" title="Subscribe to a feed (A)">＋ Add feed</button>
      <button class="btn" id="btnRefreshAll" title="Refresh all feeds (R)">⟳ Refresh all</button>
      <button class="btn" id="btnSplit" title="Add a pane (split view)">◫ Split</button>
      <button class="btn" id="btnSettings" title="Feeds &amp; settings">⚙ Settings</button>
      <button class="btn" id="btnAsrun" title="As-run log: who did what, what went on air">📋 As-run</button>
      <div class="usermenu">
        <button class="btn" id="btnUser" title="Your account"></button>
        <div class="menu" id="userMenu" hidden>
          <button type="button" data-u="password">Change my password</button>
          <button type="button" data-u="users" class="admin-only">Manage accounts…</button>
          <button type="button" data-u="logout">Log out</button>
        </div>
      </div>
    </div>
  </header>
  <div class="banner" id="defaultPwBanner" hidden>⚠ You are using the default password. <button class="btn small" data-u="password">Change it now</button></div>

  <main class="layout">
    <section class="panes" id="panes"></section>

    <aside class="output-panel" id="outputPanel">
      <div class="op-head">
        <label class="op-label" for="outputSelect">Output</label>
        <select id="outputSelect"></select>
        <button class="icon-btn admin-only" id="btnNewOutput" title="New output feed">＋</button>
        <button class="icon-btn admin-only" id="btnDesigner" title="Ticker designer: appearance &amp; layout">🎨</button>
        <button class="icon-btn" id="btnOutputSettings" title="Output settings &amp; auto-rules">⚙</button>
      </div>
      <div class="takebar" id="takebar"></div>
      <div class="op-endpoints" id="endpoints"></div>
      <form class="op-custom" id="customForm" autocomplete="off">
        <input id="customText" placeholder="Type a custom ticker line (promo, coming up…)" maxlength="400">
        <select id="customCategory" title="Category" class="cat-select"></select>
        <label class="chk" title="Mark as breaking"><input type="checkbox" id="customBreaking"> ⚡</label>
        <button type="button" class="icon-btn" id="customTiming" title="Schedule this line (start, end, daily window)">⏰</button>
        <button class="btn small">Add</button>
      </form>
      <div class="op-tools"><button type="button" class="btn small" id="btnLiveData" title="Add a live weather line (Open-Meteo)">🌤 ＋ Live weather</button><span class="hint" id="customTimingInfo"></span></div>
      <div class="op-stats" id="opStats"></div>
      <ol class="entries" id="entries"></ol>
      <div class="op-foot">
        <button class="btn small" id="btnCopyTo">Copy to output…</button>
        <button class="btn small danger" id="btnClear">Clear all</button>
      </div>
    </aside>
  </main>

  <footer class="preview" id="multiview">
    <div class="mv-row pvw" id="pvwRow"><span class="preview-label" title="Preview: what TAKE will put on air">PVW</span><iframe id="pvwFrame" title="Preview ticker"></iframe></div>
    <div class="mv-row pgm"><span class="preview-label" title="Program: on air now">PGM</span><iframe id="previewFrame" title="On-air ticker"></iframe></div>
  </footer>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toasts"></div>

  <script src="categorize.js"></script>
  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
